name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI (Lint, Typecheck, Tests, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finanzas_user
          POSTGRES_PASSWORD: finanzas_password
          POSTGRES_DB: finanzas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://finanzas_user:finanzas_password@localhost:5432/finanzas_db?schema=public
      JWT_SECRET: ci_test_jwt_secret_key_12345
      PORT: 3000

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Generar Cliente Prisma
        run: npx prisma generate

      - name: Aplicar Esquema en Base de Datos
        run: npx prisma db push

      - name: Ejecutar Linter (Oxlint)
        run: npm run lint

      - name: Ejecutar Tests Unitarios (Vitest)
        run: npm test

      - name: Ejecutar Tests E2E (Supertest)
        run: npm run test:e2e

      - name: Compilar para Producción (Build)
        run: npm run build

  frontend-ci:
    name: Frontend CI (Lint, Typecheck, Tests, Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificación de Tipos TypeScript (tsc)
        run: npx tsc -b --noEmit

      - name: Ejecutar Linter (Oxlint)
        run: npm run lint

      - name: Ejecutar Tests Unitarios (Vitest + Testing Library)
        run: npm test

      - name: Compilar para Producción (Vite Build)
        run: npm run build
